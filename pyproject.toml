[project]
name = "mcs-red"
version = "0.1.0"
description = "\"Monte Carlo Simulation for Real Estate Strategy\""
authors = [
    {name = "Lucas",email = "88989607+acostadlucas@users.noreply.github.com"}
]
license = {text = "\"GPL-3.0\""}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy (>=2.3.1,<3.0.0)",
    "matplotlib (>=3.10.3,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "scipy (==1.15.3)",
    "nbimporter (>=0.3.4,<0.4.0)",
    "pyarrow (>=21.0.0,<22.0.0)",
    "ollama (>=0.5.3,<0.6.0)",
    "statsforecast (>=2.0.2,<3.0.0)",
    "scikit-learn (>=1.7.1,<2.0.0)",
    "country-converter (>=1.3.1,<2.0.0)",
    "geopandas (>=1.1.1,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
notebook = "^7.4.4"
python-dotenv = "^1.1.1"

